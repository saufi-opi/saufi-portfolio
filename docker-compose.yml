services:
  saufi-portfolio:
    build: .
    container_name: saufi-portfolio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saufi-portfolio.rule=Host(`saufi.${DOMAIN}`)"
      - "traefik.http.routers.saufi-portfolio.entrypoints=web"
      - "traefik.http.services.saufi-portfolio.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
