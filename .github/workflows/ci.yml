name: ci

on:
  push:
    branches: [main, cms]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: mkdir -p data && npm run build
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: file:./data/ci-placeholder.db
          MEDIA_DIR: data/ci-media
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke test — serve and curl
        run: |
          npm run start &
          SRV=$!
          for i in $(seq 1 20); do
            admin=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin || echo 000)
            [ "$admin" = "200" ] && break
            sleep 2
          done
          echo "admin HTTP $admin"
          [ "$admin" = "200" ] || { kill $SRV; exit 1; }
          # / needs a seeded volume (sqlite schema never auto-pushes in prod); admin surface
          # proves server + payload + routing. Frontend rendering verified at deploy step.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
          echo "front HTTP $code (500 expected on CI: no seeded db volume)"
          kill $SRV
          echo "smoke OK"
