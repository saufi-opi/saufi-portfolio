name: ci

on:
  push:
    branches: [main, cms]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: mkdir -p data && npm run build
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: file:./data/ci-placeholder.db
          MEDIA_DIR: data/ci-media
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke test — serve and curl
        run: |
          npm run start &
          SRV=$!
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
          curl -s http://localhost:3000/ | grep -q "Ahmad Saufi" || exit 1
          admin=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)
          echo "admin HTTP $admin"
          [ "$admin" = "200" ] || exit 1
          kill $SRV
          echo "smoke OK"
