name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: saufi-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — serve and curl
        run: |
          docker run -d --rm --name smoke -p 8080:80 saufi-portfolio:ci
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code"
          [ "$code" = "200" ] || { docker logs $(docker ps -q --filter name=smoke); exit 1; }
          curl -s http://localhost:8080/ | grep -q "Ahmad Saufi" || exit 1
          echo "smoke OK"
